name: OpenEvidence
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
description: OpenEvidence is a clinical decision-support search platform that uses generative AI
  grounded in peer-reviewed medical literature to answer clinical questions for verified clinicians.
  The product is free for U.S. licensed clinicians and is monetized through pharmaceutical
  advertising; partnerships include the New England Journal of Medicine, JAMA, NCCN, and the
  Cochrane Library. As of 2026 it serves more than 860,000 verified clinicians. OpenEvidence does
  not currently expose a public self-service developer API.
